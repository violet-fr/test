version: "3.8"

# 敏感配置通过环境变量注入，参考 deploy/.env.example
# 复制一份为 deploy/.env 并填入实际值后启动：cp deploy/.env.example deploy/.env

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: park-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-park}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-smart_park}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: park-redis
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    restart: unless-stopped

  backend:
    build: ../backend
    container_name: park-backend
    env_file:
      - ../backend/.env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-park}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-smart_park}
      REDIS_URL: redis://redis:6379/0
      AI_SERVICE_URL: http://ai-service:8001
    ports:
      - "8000:8000"
    volumes:
      - ../backend:/app
      - uploads:/app/static/uploads
    depends_on:
      - postgres
      - redis
    restart: unless-stopped

  ai-service:
    build: ../ai-service
    container_name: park-ai-service
    environment:
      VECTOR_DB_URL: postgresql+psycopg://${POSTGRES_USER:-park}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-smart_park}
    ports:
      - "8001:8001"
    volumes:
      - ../ai-service:/app
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: park-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
      - uploads:/var/www/uploads:ro
      - ../web-admin/dist:/var/www/admin:ro
      - ../web-screen/dist:/var/www/screen:ro
    depends_on:
      - backend
      - ai-service
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
  uploads:
